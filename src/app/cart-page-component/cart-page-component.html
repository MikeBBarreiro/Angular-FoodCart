
<app-not-found-component [visible]="!cart || cart.items.length <= 0"
    notFoundMessage="To add items to cart, please select 'Add To Cart' when viewing food item"
    resetLinkText="Go To HomePage">
</app-not-found-component>

<div class="container">

    <ul>
        @if(cart.items.length > 0){
            @for(cartItem of cart.items; track cart){
                <li>
                    <div>
                        <img [src]="cartItem.food.imageUrl" [alt]="cartItem.food.name">
                    </div>
                    <div>
                        <a href="/food/{{cartItem.food.id}}">
                            {{cartItem.food.name}}
                        </a>
                    </div>
                    <div>
                        <!-- hash tag and then a name is the same is id=quantitySelect -->
                        <select #quantitySelect (change)="changeQuantity(cartItem,quantitySelect.value)" >
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                        </select>
                    </div>

                    <div>
                        {{cartItem.price | currency}}
                    </div>

                    <div>
                        <button class="remove-button" (click)="removeFromCart(cartItem)">
                            REMOVE
                        </button>
                    </div>
                </li>
            } 
        }@else {
            <h1 class="emptyCartHeading">Your Cart is Empty</h1>
        }
    </ul>

    <div class="checkout">
        <div>
            <div class="foods-count">{{cart.items.length}}</div>
            <div class="total-price">{{cart.totalPrice | currency}}</div>
        </div>
    </div>

</div>
